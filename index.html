<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 허브</title>

<!-- Supabase JS v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Pretendard 폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
  :root {
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --line: #E4E7EC;
    --coral: #E8604C;   /* 슬즈 일정 */
    --slate: #47566B;   /* account */
    --teal:  #0E7C7B;   /* 여행일정 */
    --danger: #C0392B;
    --radius: 16px;
    font-size: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .hidden { display: none !important; }

  /* ---------- 로딩 ---------- */
  #loading {
    color: var(--ink-soft);
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }

  /* ---------- 로그인 카드 ---------- */
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 32px;
    box-shadow: 0 8px 30px rgba(27, 36, 48, 0.06);
  }

  .auth-card h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .auth-card p.sub {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #FBFBFC;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .field input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(14, 124, 123, 0.12);
  }

  .btn-primary {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--ink);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    margin-top: 14px;
    padding: 10px 12px;
    font-size: 0.85rem;
    color: var(--danger);
    background: rgba(192, 57, 43, 0.07);
    border-radius: 8px;
  }

  /* ---------- 대시보드 ---------- */
  .dashboard {
    width: 100%;
    max-width: 640px;
  }

  .dash-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .dash-header .greeting { font-size: 1.6rem; font-weight: 700; }
  .dash-header .date {
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .btn-logout {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-logout:hover { background: #ECEEF1; }

  .link-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  @media (min-width: 560px) {
    .link-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .link-card {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px 20px 20px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .link-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent);
  }

  .link-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(27, 36, 48, 0.10);
  }

  .link-card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .link-card .icon { font-size: 1.7rem; margin-bottom: 12px; display: block; }
  .link-card .title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
  .link-card .desc { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.45; }

  .card-seulz  { --accent: var(--coral); }
  .card-account{ --accent: var(--slate); }
  .card-travel { --accent: var(--teal); }

  .user-email {
    margin-top: 24px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .link-card, .btn-primary, .field input { transition: none; }
  }
</style>
</head>
<body>

<!-- 1) 세션 확인 중 -->
<div id="loading">확인 중…</div>

<!-- 2) 로그인 화면 -->
<div id="auth-view" class="auth-card hidden">
  <h1>우리집 허브</h1>
  <p class="sub">등록된 가족 계정으로 로그인하세요.</p>

  <div class="field">
    <label for="email">이메일</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
  </div>

  <button class="btn-primary" id="btn-login">로그인</button>
  <div id="auth-error" class="error-msg hidden"></div>
</div>

<!-- 3) 로그인 후 대시보드 -->
<div id="dash-view" class="dashboard hidden">
  <div class="dash-header">
    <div>
      <div class="greeting" id="greeting">안녕하세요!</div>
      <div class="date" id="today"></div>
    </div>
    <button class="btn-logout" id="btn-logout">로그아웃</button>
  </div>

  <div class="link-grid">
    <a href="seulz-schedule.html" class="link-card card-seulz">
      <span class="icon">🗓️</span>
      <span class="title">슬즈 일정</span>
      <span class="desc">윤슬·찬슬 주간 일정 보기</span>
    </a>
    <a href="account.html" class="link-card card-account">
      <span class="icon">👤</span>
      <span class="title">Account</span>
      <span class="desc">계정 정보 및 비밀번호 관리</span>
    </a>
    <a href="travel.html" class="link-card card-travel">
      <span class="icon">✈️</span>
      <span class="title">여행일정</span>
      <span class="desc">가족 여행 일정 및 준비물</span>
    </a>
  </div>

  <div class="user-email" id="user-email"></div>
</div>

<script>
  /* =========================================================
     ① Supabase 설정 — 본인 프로젝트 값으로 교체하세요
     Supabase Dashboard → Settings → API 에서 확인
     ========================================================= */
  const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_ANON_PUBLIC_KEY";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ---------- DOM ---------- */
  const $loading  = document.getElementById("loading");
  const $auth     = document.getElementById("auth-view");
  const $dash     = document.getElementById("dash-view");
  const $email    = document.getElementById("email");
  const $password = document.getElementById("password");
  const $btnLogin = document.getElementById("btn-login");
  const $btnLogout= document.getElementById("btn-logout");
  const $error    = document.getElementById("auth-error");

  function show(view) {
    $loading.classList.add("hidden");
    $auth.classList.add("hidden");
    $dash.classList.add("hidden");
    view.classList.remove("hidden");
  }

  /* ---------- 시간대별 인사 + 오늘 날짜 ---------- */
  function renderGreeting(user) {
    const h = new Date().getHours();
    let msg;
    if (h < 6)       msg = "늦은 밤이에요 🌙";
    else if (h < 12) msg = "좋은 아침이에요 ☀️";
    else if (h < 18) msg = "좋은 오후예요 🌤️";
    else             msg = "편안한 저녁이에요 🌆";
    document.getElementById("greeting").textContent = msg;

    document.getElementById("today").textContent =
      new Date().toLocaleDateString("ko-KR", {
        year: "numeric", month: "long", day: "numeric", weekday: "long"
      });

    document.getElementById("user-email").textContent =
      user.email + " 계정으로 로그인됨";
  }

  /* ---------- 세션 확인 (페이지 진입 시) ---------- */
  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      renderGreeting(session.user);
      show($dash);
    } else {
      show($auth);
    }
  }

  /* ---------- 로그인 ---------- */
  async function login() {
    $error.classList.add("hidden");
    const email = $email.value.trim();
    const password = $password.value;

    if (!email || !password) {
      showError("이메일과 비밀번호를 모두 입력해주세요.");
      return;
    }

    $btnLogin.disabled = true;
    $btnLogin.textContent = "로그인 중…";

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    $btnLogin.disabled = false;
    $btnLogin.textContent = "로그인";

    if (error) {
      // 등록되지 않은 사용자 / 비밀번호 오류 모두 여기로
      showError("로그인에 실패했어요. 이메일 또는 비밀번호를 확인해주세요.");
      console.error(error.message);
      return;
    }

    renderGreeting(data.user);
    show($dash);
  }

  function showError(msg) {
    $error.textContent = msg;
    $error.classList.remove("hidden");
  }

  /* ---------- 로그아웃 ---------- */
  async function logout() {
    await sb.auth.signOut();
    $password.value = "";
    show($auth);
  }

  /* ---------- 이벤트 ---------- */
  $btnLogin.addEventListener("click", login);
  $btnLogout.addEventListener("click", logout);
  $password.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
  $email.addEventListener("keydown", e => { if (e.key === "Enter") $password.focus(); });

  /* ---------- 세션 상태 변화 감지 (토큰 만료 등) ---------- */
  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") show($auth);
  });

  checkSession();
</script>
</body>
</html>
