<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가족 통합 대시보드</title>
    <style>
        /* 기본 스타일 초기화 및 배경 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 대시보드 메인 컨테이너 */
        .dashboard-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* 타이틀 스타일 */
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 35px;
        }

        /* 메뉴 리스트 (세로 배열 카드 스타일) */
        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 개별 메뉴 카드 링크 및 버튼 */
        .menu-item a, .menu-item button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px 25px;
            text-decoration: none;
            border-radius: 15px;
            background: #ffffff;
            border: 1px solid #eaeaea;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            cursor: pointer;
            font-family: inherit;
        }

        /* 메뉴 카드 아이콘 공간 */
        .menu-icon {
            font-size: 28px;
            margin-right: 20px;
        }

        /* 메뉴 텍스트 공간 */
        .menu-text {
            text-align: left;
        }
        .menu-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .menu-desc {
            font-size: 12px;
            color: #888;
        }

        /* 마우스 호버 효과 (마우스를 올리거나 터치할 때) */
        .menu-item a:hover, .menu-item button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* 각 메뉴별 포인트 컬러 테두리 효과 */
        .academy a:hover { border-color: #4ea8de; }
        .academy .menu-title { color: #4ea8de; }
        
        .account button:hover { border-color: #95a5a6; background-color: #fcfcfc; }
        .account .menu-title { color: #7f8c8d; }
        
        .travel a:hover { border-color: #e76f51; }
        .travel .menu-title { color: #e76f51; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>우리집 통합 대시보드</h1>
        <p class="subtitle">가족 일과 및 자산을 관리하는 공간입니다.</p>
        
        <ul class="menu-list">
            <li class="menu-item academy">
                <a href="슬즈일정.html">
                    <span class="menu-icon">📅</span>
                    <div class="menu-text">
                        <div class="menu-title">학원 schedule</div>
                        <div class="menu-desc">아이들의 요일별 학원 시간표 및 진도 관리</div>
                    </div>
                </a>
            </li>

            <li class="menu-item account">
                <button onclick="alert('자산 현황 페이지는 아직 준비 중입니다! 업데이트를 기다려주세요.')">
                    <span class="menu-icon">💰</span>
                    <div class="menu-text">
                        <div class="menu-title">자산 현황 (account)</div>
                        <div class="menu-desc">페이지 준비 중 (가계 자산 흐름 및 수입/지출 내역)</div>
                    </div>
                </button>
            </li>

            <li class="menu-item travel">
                <a href="bali_master_plan.html">
                    <span class="menu-icon">✈️</span>
                    <div class="menu-text">
                        <div class="menu-title">여행 일정</div>
                        <div class="menu-desc">발리 가족 여행 계획, 준비물 및 숙소 정보</div>
                    </div>
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
