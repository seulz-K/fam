<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가족 통합 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f6f9; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .menu-list { list-style: none; padding: 0; }
        .menu-list li { margin: 15px 0; }
        .menu-list a { display: block; padding: 15px; background: #e9ecef; color: #333; text-decoration: none; border-radius: 4px; text-align: center; font-weight: bold; transition: 0.2s; }
        .menu-list a:hover { background: #007bff; color: white; }
        .logout-btn { background-color: #dc3545; margin-top: 20px; }
        .logout-btn:hover { background-color: #bd2130; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-section">
            <h2>가족 서비스 로그인</h2>
            <input type="email" id="email" placeholder="이메일 주소">
            <input type="password" id="password" placeholder="비밀번호">
            <button onclick="signIn()">로그인</button>
        </div>

        <div id="menu-section" style="display: none;">
            <h2>🏠 메인 메뉴</h2>
            <p id="welcome-msg" style="text-align: center; color: #666;"></p>
            
            <ul class="menu-list">
                <li><a href="academy.html">📅 학원 schedule</a></li>
                <li><a href="account.html">💰 account (자산흐름)</a></li>
                <li><a href="travel.html">✈️ 여행일정</a></li>
            </ul>

            <button class="logout-btn" onclick="signOut()">로그아웃</button>
        </div>
    </div>

    <script>
        // 본인의 Supabase 정보로 꼭 변경해주세요!
        const SUPABASE_URL = "https://enezfhqbedvpqcmfuecb.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lrbZM7Axj3U8CaSYCUisQA_XYf_fbB7";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 페이지가 로드될 때 로그인 상태를 자동으로 체크합니다.
        window.onload = async function() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showMenu(session.user.email);
            }
        };

        // 로그인 함수
        // 기존 signIn() 함수를 아래 코드로 완전히 교체해 보세요.
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
        
            if(!email || !password) {
                alert("이메일과 비밀번호를 입력해주세요.");
                return;
            }
        
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    // 이메일 미인증 시 보통 "Email not confirmed" 에러 알림이 뜹니다.
                    alert("Supabase 에러 발생: " + error.message); 
                } else {
                    showMenu(data.user.email);
                }
            } catch (unexpectedError) {
                // 주소나 Key가 잘못되어 인터넷 연결 자체가 실패한 경우 여기로 들어옵니다.
                alert("시스템 에러(주소/Key 오류 가능성): " + unexpectedError.message);
            }
        }


        // 로그아웃 함수
        async function signOut() {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert("로그아웃 실패: " + error.message);
            } else {
                alert("로그아웃 되었습니다.");
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('menu-section').style.display = 'none';
                // 입력창 초기화
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        }

        // 로그인 성공 시 화면을 메뉴 화면으로 전환하는 함수
        function showMenu(email) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('menu-section').style.display = 'block';
            document.getElementById('welcome-msg').innerText = `${email}님 환영합니다.`;
        }
    </script>
</body>
</html>
